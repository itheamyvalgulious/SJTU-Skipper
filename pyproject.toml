[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sjtu-skipper"
version = "0.1.0"
description = "Classroom total-agent architecture: streaming input, STT, VLM, LLM, behavior plugins and web UI."
readme = "docs/architecture.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "SJTU-Skipper" }]
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "httpx2>=2.16.2,<3.0",
  "pydantic>=2.7,<3.0",
  "python-dotenv>=1.0,<2.0",
  "numpy>=1.26,<3.0",
  "pillow>=13.0,<14.0",
  "markdown-it-py>=4.3,<5.0",
  "mdit-py-plugins>=0.5,<1.0",
  "beautifulsoup4>=4.12,<5.0",
  "google-auth>=2.20,<3.0",
  "websockets>=17.4,<18",
  "rich>=15.0,<16.0",
  "typer>=0.12,<1.0",
]

[project.optional-dependencies]
dev = ["pytest>=9.2,<10.0", "pytest-asyncio>=1.5,<2.0"]
ui-test = ["playwright>=1.40,<2.0"]

[project.scripts]
sjtu-skipper = "cli:main"

[tool.setuptools]
py-modules = ["app", "applog", "cli", "config"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["agent_runtime*", "core*", "plugins*", "ui*", "integrations*"]

[tool.setuptools.package-data]
ui = ["static/*", "static/vendor/**/*"]
agent_runtime = ["*.ts", "prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.format]
indent-style = "space"
quote-style = "double"
line-ending = "lf"
docstring-code-format = false
