[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sjtu-skipper"
version = "0.1.0"
description = "Classroom total-agent architecture: streaming input, STT, VLM, LLM, behavior plugins and web UI."
readme = "docs/architecture.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "SJTU-Skipper" }]
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "httpx>=0.27,<1.0",
  "pydantic>=2.7,<3.0",
  "python-dotenv>=1.0,<2.0",
  "numpy>=1.26,<3.0",
  "pillow>=10.0,<13.0",
  "markdown-it-py>=3.0,<4.0",
  "beautifulsoup4>=4.12,<5.0",
  "rich>=13.7,<15.0",
  "typer>=0.12,<1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9.0", "pytest-asyncio>=0.23,<1.0"]
ui-test = ["playwright>=1.40,<2.0"]

[project.scripts]
sjtu-skipper = "cli:main"
lecture-agent = "cli:main"

[tool.setuptools]
py-modules = ["app", "applog", "cli", "config"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["core*", "llm*", "plugins*", "ui*", "integrations*"]

[tool.setuptools.package-data]
ui = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
